site_name: GTM Commercial Engineering
site_description: An open handbook for GTM engineering, RevOps, and commercial systems.
site_author: Stephen Stilwell and contributors
site_url: !ENV SITE_URL
repo_name: GitHub
repo_url: https://github.com/stephenstilwell/gtm-commercial-engineering
copyright: A Useful in Practice publication · Original documentation licensed CC BY 4.0

theme:
  name: material
  font: false
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Use dark color scheme
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Use light color scheme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

extra_css:
  - stylesheets/publication.css

markdown_extensions:
  - tables
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Learn:
      - Learning roadmap: roadmap.md
      - Learning resources: learn/resources.md
      - GTM engineering fundamentals: fundamentals.md
      - Model a commercial system: learn/systems.md
      - Revenue operations architecture: revops.md
      - CRM data models and enrichment: crm.md
      - Buying signals and event-driven workflows: signals.md
      - Customer lifecycle engineering: lifecycle.md
      - AI agents for business operations: agents.md
      - Pipeline measurement and attribution: learn/pipeline-attribution.md
      - Measurement, experimentation, and ROI: measurement.md
      - Security, compliance, and data governance: governance.md
  - Explore:
      - Category index: explore/index.md
      - Tool catalog: explore/catalog.md
  - Build:
      - Workflow examples: build/index.md
      - Signal-to-opportunity routing: build/routing.md
      - Evidence and review pipelines: build/evidence.md
      - Lifecycle monitoring and measurement: build/lifecycle.md
      - Validate offers for AI-assisted buying: build/commerce.md
      - Offline lab interface: labs.md
      - n8n, Clay, Apollo, and HubSpot: workflows.md
      - Operational checklists: checklists.md
  - Research:
      - Research agenda: research/index.md
      - Evidence freshness and oversight: research/evidence.md
      - Lifecycle autonomy and replays: research/lifecycle.md
      - Buyer readiness and agent-to-agent commerce: research/commerce.md
      - Partnership intelligence: partnerships.md
      - Product-market intelligence: product-market.md
      - Vertical opportunity intelligence: verticals.md
      - Agentic commerce and AI buyer readiness: commerce.md
  - Project:
      - Primary sources: resources.md
      - Resource review: resource-review.md
      - Handbook expansion audit: maintainer/handbook-audit.md
